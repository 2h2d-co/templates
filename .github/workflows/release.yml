name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: templates-release
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.6.14"
          install_args: --locked
          cache: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "templates releases require a stable semantic version tag" >&2
            exit 1
          fi
          if [[ $(git cat-file -t "refs/tags/$GITHUB_REF_NAME") != commit ]]; then
            echo "release tag $GITHUB_REF_NAME must be a lightweight tag" >&2
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          if [[ $tag_commit != "$GITHUB_SHA" ]]; then
            echo "release tag $GITHUB_REF_NAME does not point to workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "release tag $GITHUB_REF_NAME does not point to a commit on origin/main" >&2
            exit 1
          fi
          subject=$(git log -1 --pretty=%s "$tag_commit")
          if [[ $subject != "release: $GITHUB_REF_NAME" ]]; then
            echo "release commit subject $subject does not match release: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/release-signers" \
            verify-commit "$tag_commit"
          version=${GITHUB_REF_NAME#v}
          if ! grep -Eq "^## \\[$version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated $version release section" >&2
            exit 1
          fi
      - name: Run checks
        run: hk check --all --check

  release:
    name: Create release
    needs: validate
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write # Required to create the GitHub release.
    steps:
      - name: Revalidate protected refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_type=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq .object.type)
          tag_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq .object.sha)
          main_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq .object.sha)
          if [[ $tag_type != commit || $tag_sha != "$GITHUB_SHA" ]]; then
            echo "release tag no longer points directly to workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          comparison=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$main_sha" \
            --jq .status)
          if [[ $comparison != identical && $comparison != ahead ]]; then
            echo "release commit $GITHUB_SHA is no longer an ancestor of main" >&2
            exit 1
          fi
          verified=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" \
            --jq .verification.verified)
          if [[ $verified != true ]]; then
            echo "GitHub does not recognize release commit $GITHUB_SHA as signed" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --verify-tag
