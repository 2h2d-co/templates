[tools]
hk = { version = "2.13.0", workflow = "release.yml", postinstall = "hk install --mise" }
betterleaks = "1.10.1"
cocogitto = "7.0.0"
jactionlint = "2.6.0"
zizmor = "1.32.0"
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.2"

[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tasks.check]
description = "Run all non-writing project checks"
run = [
  "go mod verify",
  "go test -race -mod=readonly ./...",
  "go build ./...",
  "hk check --all --check",
  "goreleaser check",
]
