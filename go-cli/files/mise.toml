[tools]
hk = { version = "2.8.0", workflow = "release.yml", postinstall = "hk install --mise" }
betterleaks = "1.9.0"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
go = "1.27.3"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"

[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tasks.check]
description = "Run all non-writing project checks"
run = [
  "go mod verify",
  "go test -race -mod=readonly ./...",
  "go build ./...",
  "hk check --all --check",
  "goreleaser check",
]
