[tools]
hk = { version = "2.0.1", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.29.0"
go = "1.26.7"
golangci-lint = "2.13.1"
goreleaser = "2.17.1"

[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[tasks.check]
description = "Run all non-writing project checks"
run = [
  "go mod verify",
  "go test -race -mod=readonly ./...",
  "go build ./...",
  "hk check --all --check",
  "goreleaser check",
]
