name = "Pi Extension"
description = "Pi package with a TypeScript extension entrypoint"

[[variables]]
name = "description"
type = "string"
prompt = "Description"
default = "A Pi package with a TypeScript extension"

[[variables]]
name = "packageName"
type = "string"
prompt = "npm package name"
default = "{{ projectName }}"
required = true

[[variables]]
name = "githubOwner"
type = "string"
prompt = "GitHub owner"
default = "{{ system.defaults.githubOwner }}"
required = true

[[variables]]
name = "repoName"
type = "string"
prompt = "GitHub repository name"
default = "{{ projectName }}"
required = true

[[variables]]
name = "authorName"
type = "string"
prompt = "Author name"
default = "{{ system.defaults.authorName }}"
required = true

[[variables]]
name = "authorEmail"
type = "string"
prompt = "Author email"
default = "{{ system.defaults.authorEmail }}"

[[variables]]
name = "authorUrl"
type = "string"
prompt = "Author URL"
default = "{{ system.defaults.authorUrl }}"

[[variables]]
name = "licensor"
type = "string"
prompt = "MIT licensor"
default = "{{ system.defaults.licensor }}"
required = true

[npm]
package_name = "{{ packageName }}"
version = "0.0.1-alpha.0"
tag = "alpha"
access = "public"

[github]
release_environment = "npm-publish"

[[commands]]
name = "Install development tools"
run = "mise trust && mise install"

[[commands]]
name = "Install dependencies"
run = "mise exec -- npm install"

[[commands]]
name = "Typecheck"
run = "mise exec -- npm run check"

[[commands]]
name = "Test"
run = "mise exec -- npm test"
